<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laberinto — Combate Táctico</title>
  <link rel="stylesheet" href="css/battle.css?ver=2026.10.01h">
  <link rel="stylesheet" href="css/laberinto2.css?ver=2026.10.01h">
  <script type="module" src="js/laberinto.js?ver=2026.10.01h"></script>
</head>

<body class="laberinto-body">

  <h1>Laberinto</h1>
  <div class="subtitle" id="roomLabel">Sala 1</div>
  <div class="subtitle" id="hoursLabel">⏳ 24h restantes</div>

  <div class="unit-card player" id="playerStatsCard">
    <h3>Jugador</h3>
    <div class="bar-row"><span>HP</span>
      <div class="bar-track">
        <div class="bar-fill hp-fill" id="playerHpBar"></div>
      </div><span id="playerHpText"></span>
    </div>
    <div class="bar-row"><span>Oro</span><span id="playerGoldText"></span></div>
    <!-- Mismo "Descansar" que el de abajo; solo se ve en celular, al lado
         de la vida (ver laberinto2.css). -->
    <button class="rest-btn rest-btn--card" id="restBtnCard" type="button">Descansar</button>
  </div>

  <div class="subtitle">elegí tu camino</div>

  <div class="laberinto-wrap">
    <div class="paths-list" id="pathsList"></div>

    <button class="rest-btn" id="restBtn">Descansar</button>
  </div>

  <div id="laberintoClosedOverlay">
    <h2>El laberinto se ha cerrado</h2>
    <p>Serás transportado a la ciudad con todo lo que has ganado.</p>
    <button class="rest-btn" id="closedContinueBtn">Volver a la ciudad</button>
  </div>

</body>

</html>
